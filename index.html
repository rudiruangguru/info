<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Hasil Try Out | Bimbel Ruangguru Purworejo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14233f;--muted:#5d6a82;--paper:#f6f4ef;--card:#fff;--line:#dcd8cd;--accent:#e8590c;--bar:#1f4fb4;--bar-bg:#e7e9f0;--warn:#b45309;--wa:#17803d}
@media (prefers-color-scheme:dark){:root{--ink:#eef1f8;--muted:#a3adc2;--paper:#0f1626;--card:#18223a;--line:#2c3853;--accent:#ff8a4c;--bar:#6e9bff;--bar-bg:#2a3652;--warn:#f0a04b;--wa:#3fb868}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
header.logos{background:#fff;border-bottom:1px solid var(--line)}
.logos-in{max-width:720px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.logo{margin:0;display:flex;align-items:center;height:48px}
.logo img{height:100%;width:auto;max-width:150px;object-fit:contain;display:block}
.logo figcaption{display:none;font:700 .9rem "Plus Jakarta Sans",sans-serif;color:#14233f}
.logo.kosong img{display:none}
.logo.kosong figcaption{display:block}
.logo:nth-child(1){justify-self:start}.logo:nth-child(2){justify-self:center}.logo:nth-child(3){justify-self:end}
@media (max-width:520px){.logo{height:36px}.logo img{max-width:96px}.logo figcaption{font-size:.75rem;text-align:center}}
main{max-width:720px;margin:0 auto;padding:32px 20px 64px}
h1{font:800 clamp(2rem,6vw,3rem)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 12px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 26px;max-width:52ch}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:.9375rem;margin:0 0 6px}
input,select{width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px}
input:focus,select:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button,.btn{font:700 1rem "Plus Jakarta Sans",sans-serif;padding:14px 22px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button:focus-visible,.btn:focus-visible,.pilih:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hint{font-size:.875rem;color:var(--muted);margin:10px 0 0}
.tautan{background:none;border:0;padding:0;color:var(--accent);font:700 .875rem "Plus Jakarta Sans",sans-serif;text-decoration:underline;cursor:pointer}
#status{margin:28px 0 0}
.pesan{padding:14px 16px;border-left:4px solid var(--warn);background:var(--card);border-radius:0 10px 10px 0}
.pesan.err{border-color:#c0392b}
.demo{font-size:.8125rem;color:var(--warn);margin:0 0 16px}
.pilih{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 8px;font-weight:500}
.pilih small{display:block;color:var(--muted);font-weight:400}
.rapor{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:8px}
.rapor h2{font:800 1.6rem/1.15 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.meta{color:var(--muted);margin:0 0 22px;font-size:.9375rem}
.mapel{display:grid;grid-template-columns:minmax(110px,170px) 1fr 3ch;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mapel:first-of-type{border-top:0}
.track{height:12px;background:var(--bar-bg);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:6px;transform-origin:left;animation:isi .7s ease-out both}
@keyframes isi{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.fill{animation:none}}
.skor{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ringkas{display:flex;gap:12px 36px;margin:20px 0 0;padding:18px 0 0;border-top:2px solid var(--ink)}
.ringkas dt{font-size:.8125rem;color:var(--muted)}
.ringkas dd{margin:0;font:800 1.75rem/1.2 "Bricolage Grotesque",sans-serif}
.rank{margin-top:22px}
.rank h3{font:800 1.1rem "Bricolage Grotesque",sans-serif;margin:0 0 10px}
.rank-row{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.rank-row b{font-size:1rem}
.rank-row span{color:var(--muted);font-size:.875rem;grid-column:1}
.rank-row .no{grid-row:1/3;grid-column:2;font:800 2rem/1 "Bricolage Grotesque",sans-serif;color:var(--accent);text-align:right}
.rank-row .no small{font:500 .875rem "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.ajak{margin-top:24px;padding:18px;border-radius:12px;background:var(--bar-bg)}
.ajak p{margin:0 0 14px}
.aksi{display:flex;gap:10px;flex-wrap:wrap}
.aksi .btn{flex:1 1 200px}
.aksi .alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.ringkas+.lihat{margin-top:16px}
.lihat{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:11px 18px}
:root{--benar:#18794e;--salah:#c0392b;--kosong:#9aa3b5}
@media (prefers-color-scheme:dark){:root{--benar:#4cc38a;--salah:#ff7a6b;--kosong:#6b7691}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,16,30,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px 16px;overflow:auto;animation:muncul .2s ease-out}
.overlay[hidden]{display:none}
@keyframes muncul{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.overlay{animation:none}}
.sheet{position:relative;width:100%;max-width:640px;background:var(--card);border-radius:16px;padding:22px 22px 24px;margin:auto 0}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.sheet h2{font:800 1.5rem/1.15 "Bricolage Grotesque",sans-serif;margin:0}
.sheet .sub{color:var(--muted);margin:2px 0 0;font-size:.9375rem}
.tutup{flex:none;background:var(--ink);color:var(--card);padding:9px 16px;border-radius:999px;font-size:.9rem}
.judulcetak{margin:18px 0 0;padding-top:14px;border-top:2px solid var(--ink);font-weight:700}
.grafik{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.donat{text-align:center;padding:14px 8px;border:1px solid var(--line);border-radius:12px}
.donat svg{width:150px;max-width:100%;height:auto;display:block;margin:6px auto 8px}
.donat .pct{font:800 26px "Bricolage Grotesque",sans-serif;fill:var(--ink)}
.donat .lbl{font:500 11px "Plus Jakarta Sans",sans-serif;fill:var(--muted)}
.donat h3{margin:0;font:800 1.05rem "Bricolage Grotesque",sans-serif}
.donat small{color:var(--muted)}
.angka{display:flex;justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.angka span{display:flex;align-items:center;gap:6px;font-size:.9rem}
.angka i{width:11px;height:11px;border-radius:50%;display:inline-block}
.angka b{font-variant-numeric:tabular-nums}
.sheet-foot{margin-top:18px;display:flex;justify-content:flex-end}
@media (max-width:520px){.grafik{grid-template-columns:1fr}}
@media (max-width:520px){form{grid-template-columns:1fr}.mapel{grid-template-columns:1fr 3ch;row-gap:4px}.track{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<header class="logos"><div class="logos-in"><figure class="logo"><img src="assets/logo-kemendikbud.png" alt="Kementerian Pendidikan" onerror="this.parentNode.classList.add('kosong')"><figcaption>Kementerian Pendidikan</figcaption></figure><figure class="logo"><img src="assets/logo-ruangguru.png" alt="Ruangguru" onerror="this.parentNode.classList.add('kosong')"><figcaption>Ruangguru</figcaption></figure><figure class="logo"><img src="assets/logo-pemkab-purworejo.png" alt="Pemkab Purworejo" onerror="this.parentNode.classList.add('kosong')"><figcaption>Pemkab Purworejo</figcaption></figure></div></header>
<main>
  <h1>Cek hasil try out kamu</h1>
  <p class="lead">Isi nama, kelas, dan sekolahmu. Kamu akan melihat nilai tiap mapel dan peringkatmu di kelas, sekolah, dan seluruh Purworejo.</p>

  <form id="form" autocomplete="off">
    <div class="full">
      <label for="nama">Nama lengkap</label>
      <input id="nama" required minlength="3" placeholder="Contoh: Rudi Saputra">
    </div>
    <div>
      <label for="jenjang">Jenjang</label>
      <select id="jenjang" required><option value="">Memuat...</option></select>
    </div>
    <div>
      <label for="kelas">Kelas</label>
      <select id="kelas" required><option value="">Pilih jenjang dulu</option></select>
    </div>
    <div class="full">
      <label for="sekolah">Sekolah</label>
      <input id="sekolah" list="daftarSekolah" required placeholder="Ketik, lalu pilih dari daftar">
      <datalist id="daftarSekolah"></datalist>
    </div>
    <div class="full"><button type="submit">Cari hasil</button></div>
  </form>
  <p class="hint">Jenjang, kelas, dan sekolah diambil dari data peserta try out.</p>
  <p class="hint" id="contohWrap" hidden>Ingin lihat tampilan hasilnya? <button type="button" id="isiContoh" class="tautan">Isi dengan contoh</button></p>

  <div id="status" aria-live="polite"></div>
</main>

<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="ovJudul">
  <div class="sheet">
    <div class="sheet-top">
      <div><h2 id="ovJudul">Hasil Try Out</h2><p class="sub" id="ovSub"></p></div>
      <button type="button" class="tutup" id="tutup">Close</button>
    </div>
    <p class="judulcetak">Grafik benar dan salah</p>
    <div class="grafik" id="ovGrafik"></div>
    <div class="sheet-foot"><button type="button" class="tutup" id="tutup2">Close</button></div>
  </div>
</div>

<script>
// ====== PENGATURAN ======
var SCORE_URL = "";      // alamat Apps Script (/exec). Kosong = pakai data contoh.
var WA_NUMBER = "";      // nomor WhatsApp admin, format 628xxxxxxxxxx. Kosong = pengguna memilih kontak sendiri.
var SKOR_MAKS = 100;
// Mode simulasi (aktif selama SCORE_URL kosong): klik "Cari hasil" langsung menampilkan grafik
// dengan nilai contoh di bawah. Nama, jenjang, kelas, dan sekolah diambil dari isian.
var SIMULASI = !SCORE_URL;
var SIMULASI_SOAL = 50;                                   // jumlah soal tiap mapel
var SIMULASI_NILAI = {"B. Indonesia":100, "Matematika":80}; // persen benar
var KELAS_BAWAAN = {SD:["3","4","5","6"], SMP:["7","8","9"], SMA:["10","11","12"]};
var KOLOM_INFO = ["nomor","nama","sekolah","jenjang","kelas","total","rata","rata-rata","peringkat"];

var DATA = [
  {nama:"Nabila Putri",sekolah:"SDN 1 Purworejo",jenjang:"SD",kelas:"6",Matematika:86,IPAS:90,"B. Indonesia":88,"B. Inggris":80},
  {nama:"Fikri Ramadhan",sekolah:"SDN 1 Purworejo",jenjang:"SD",kelas:"6",Matematika:78,IPAS:82,"B. Indonesia":85,"B. Inggris":74},
  {nama:"Keysha Anindya",sekolah:"SDN 3 Purworejo",jenjang:"SD",kelas:"5",Matematika:92,IPAS:88,"B. Indonesia":90,"B. Inggris":84},
  {nama:"Rudi Saputra",sekolah:"SMAN 1 Purworejo",jenjang:"SMA",kelas:"12",Matematika:85,"Matematika Benar":34,"Matematika Salah":6,Fisika:72,Kimia:78,"B. Indonesia Benar":35,"B. Indonesia Salah":5},
  {nama:"Aulia Rahma",sekolah:"SMAN 1 Purworejo",jenjang:"SMA",kelas:"12",Matematika:88,Fisika:76,Kimia:81,"B. Inggris":92},
  {nama:"Raka Pratama",sekolah:"SMAN 7 Purworejo",jenjang:"SMA",kelas:"12",Matematika:94,Fisika:90,Kimia:87,"B. Inggris":79},
  {nama:"Naufal Hakim",sekolah:"SMAN 1 Purworejo",jenjang:"SMA",kelas:"12",Matematika:70,Fisika:65,Kimia:72,"B. Inggris":80},
  {nama:"Salsa Nur",sekolah:"SMAN 1 Purworejo",jenjang:"SMA",kelas:"11",Matematika:82,Fisika:79,Kimia:75,"B. Inggris":84},
  {nama:"Dinda Safitri",sekolah:"SMPN 2 Purworejo",jenjang:"SMP",kelas:"9",Matematika:72,IPA:80,"B. Inggris":85,"B. Indonesia":78},
  {nama:"Bagas Setiawan",sekolah:"SMPN 2 Purworejo",jenjang:"SMP",kelas:"9",Matematika:90,IPA:84,"B. Inggris":77,"B. Indonesia":88},
  {nama:"Citra Lestari",sekolah:"SMPN 5 Purworejo",jenjang:"SMP",kelas:"9",Matematika:81,IPA:86,"B. Inggris":90,"B. Indonesia":84}
];

var $ = function(id){ return document.getElementById(id); };
var ALL = [], pakaiContoh = !SCORE_URL;

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function norm(s){ return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g," "); }
function kls(s){ var m = String(s == null ? "" : s).match(/\d+/); return m ? m[0] : String(s || "").trim(); }
function pesan(t, err){ $("status").innerHTML = '<div class="pesan'+(err?' err':'')+'">'+t+'</div>'; }

var BS_RE = /^(.*?)[\s_\-]*(benar|salah|kosong)$/i;
function kunci(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g, ""); }
function bsDari(row){
  var g = {}, urut = [];
  Object.keys(row).forEach(function(k){
    var m = k.trim().match(BS_RE);
    if(!m || !m[1].trim()) return;
    var id = kunci(m[1]), v = parseFloat(String(row[k]).replace(",", "."));
    if(isNaN(v)) return;
    if(!g[id]){ g[id] = {nama:m[1].trim(), benar:0, salah:0, kosong:0}; urut.push(id); }
    g[id][m[2].toLowerCase()] = v;
  });
  return urut.map(function(id){ return g[id]; });
}
function mapelDari(row){
  var out = [], ada = {};
  Object.keys(row).forEach(function(k){
    if(KOLOM_INFO.indexOf(k.trim().toLowerCase()) >= 0 || BS_RE.test(k.trim())) return;
    var v = parseFloat(String(row[k]).replace(",", "."));
    if(!isNaN(v)){ out.push({nama:k, skor:v}); ada[kunci(k)] = 1; }
  });
  // mapel yang hanya punya kolom benar/salah: nilai dihitung dari persentase benar
  bsDari(row).forEach(function(b){
    var n = b.benar + b.salah + b.kosong;
    if(!ada[kunci(b.nama)] && n > 0) out.push({nama:b.nama, skor:Math.round(b.benar / n * 100)});
  });
  return out;
}
function totalDari(row){
  var t = parseFloat(String(row.total).replace(",", "."));
  return !isNaN(t) ? t : mapelDari(row).reduce(function(a,b){ return a + b.skor; }, 0);
}
function peringkat(row, saring){
  var grup = ALL.filter(saring), mine = totalDari(row);
  var atas = grup.filter(function(r){ return totalDari(r) > mine; }).length;
  return {pos: atas + 1, dari: grup.length};
}

function muatData(){
  var p = SCORE_URL ? fetch(SCORE_URL + (SCORE_URL.indexOf("?")<0 ? "?" : "&") + "action=nilai")
    .then(function(r){ return r.json(); })
    .then(function(r){ if(!r || !r.ok) throw new Error((r && r.error) || "Data tidak valid"); return r.data || []; })
    : Promise.resolve(DATA);
  return p.then(function(rows){
    ALL = rows.map(function(r){ var o = {}; Object.keys(r).forEach(function(k){ o[String(k).trim()] = r[k]; });
      o.kelas = kls(o.kelas); o.jenjang = String(o.jenjang || "").trim().toUpperCase(); o.sekolah = String(o.sekolah || "").trim(); return o; });
    var jj = {};
    ALL.forEach(function(r){ if(r.jenjang) jj[r.jenjang] = 1; });
    var urut = ["SD","SMP","SMA"];
    urut.forEach(function(j){ jj[j] = 1; });
    var daftar = Object.keys(jj).sort(function(a,b){ return (urut.indexOf(a)+99)%99 - (urut.indexOf(b)+99)%99; });
    $("jenjang").innerHTML = '<option value="">Pilih jenjang</option>' + daftar.map(function(j){ return '<option value="'+esc(j)+'">'+esc(j)+'</option>'; }).join("");
    isiDependen();
  }).catch(function(e){
    $("jenjang").innerHTML = '<option value="">Data belum termuat</option>';
    pesan("Data belum bisa dimuat. Periksa koneksi internet lalu muat ulang halaman.", true);
    console.warn("Gagal memuat nilai:", e);
  });
}

function linkWA(teks){ return "https://wa.me/" + WA_NUMBER.replace(/\D/g,"") + "?text=" + encodeURIComponent(teks); }

var fokusAwal = null;
function donat(b){
  var n = b.benar + b.salah + b.kosong, R = 54, C = 2 * Math.PI * R, acc = 0;
  var seg = [[b.benar,"var(--benar)"],[b.salah,"var(--salah)"],[b.kosong,"var(--kosong)"]].map(function(s){
    var len = n ? s[0] / n * C : 0, el = '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+s[1]+'" stroke-width="16" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 70 70)"/>';
    acc += len; return s[0] > 0 ? el : "";
  }).join("");
  var pct = n ? Math.round(b.benar / n * 100) : 0;
  return '<div class="donat"><h3>'+esc(b.nama)+'</h3><small>'+n+' soal</small>' +
    '<svg viewBox="0 0 140 140" role="img" aria-label="'+esc(b.nama)+': '+b.benar+' benar, '+b.salah+' salah'+(b.kosong?', '+b.kosong+' kosong':'')+'">' +
    '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--bar-bg)" stroke-width="16"/>' + seg +
    '<text x="70" y="72" text-anchor="middle" class="pct">'+pct+'%</text><text x="70" y="90" text-anchor="middle" class="lbl">benar</text></svg>' +
    '<div class="angka"><span><i style="background:var(--benar)"></i>Benar <b>'+b.benar+'</b></span><span><i style="background:var(--salah)"></i>Salah <b>'+b.salah+'</b></span>' +
    (b.kosong ? '<span><i style="background:var(--kosong)"></i>Kosong <b>'+b.kosong+'</b></span>' : '') + '</div></div>';
}
function bukaGrafik(row, bs){
  $("ovSub").innerHTML = esc(row.sekolah)+' &middot; '+esc(row.jenjang)+' kelas '+esc(row.kelas);
  $("ovJudul").textContent = row.nama;
  $("ovGrafik").innerHTML = bs.map(donat).join("");
  fokusAwal = document.activeElement;
  $("overlay").hidden = false; document.body.style.overflow = "hidden";
  $("tutup").focus();
}
function tutupGrafik(){
  $("overlay").hidden = true; document.body.style.overflow = "";
  if(fokusAwal && fokusAwal.focus) fokusAwal.focus();
}
$("tutup").onclick = tutupGrafik; $("tutup2").onclick = tutupGrafik;
$("overlay").addEventListener("click", function(e){ if(e.target === this) tutupGrafik(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !$("overlay").hidden) tutupGrafik(); });

function tampilkan(row){
  var m = mapelDari(row), total = totalDari(row), bs = bsDari(row);
  var rata = m.length ? m.reduce(function(a,b){ return a + b.skor; }, 0) / m.length : 0;
  var rKelas = peringkat(row, function(r){ return r.sekolah === row.sekolah && r.kelas === row.kelas; });
  var rSekolah = peringkat(row, function(r){ return r.sekolah === row.sekolah && r.jenjang === row.jenjang; });
  var rKota = peringkat(row, function(r){ return r.jenjang === row.jenjang; });
  var lemah = m.slice().sort(function(a,b){ return a.skor - b.skor; })[0];
  var persen = rKota.pos / rKota.dari;

  var html = (pakaiContoh ? '<p class="demo">Ini data contoh. Isi SCORE_URL untuk memakai data asli.</p>' : '') +
    '<article class="rapor"><h2>'+esc(row.nama)+'</h2><p class="meta">'+esc(row.sekolah)+' &middot; '+esc(row.jenjang)+' kelas '+esc(row.kelas)+'</p>';
  m.forEach(function(x){
    var w = Math.max(0, Math.min(100, x.skor / SKOR_MAKS * 100));
    html += '<div class="mapel"><span>'+esc(x.nama)+'</span><div class="track" role="img" aria-label="'+esc(x.nama)+': '+x.skor+' dari '+SKOR_MAKS+'"><div class="fill" style="width:'+w+'%"></div></div><span class="skor">'+x.skor+'</span></div>';
  });
  html += '<dl class="ringkas"><div><dt>Total nilai</dt><dd>'+total+'</dd></div><div><dt>Rata-rata</dt><dd>'+rata.toFixed(1)+'</dd></div></dl>';
  if(bs.length) html += '<button type="button" class="btn lihat" id="lihatGrafik">Lihat grafik benar-salah</button>';

  function baris(judul, ket, r){ return '<div class="rank-row"><b>'+judul+'</b><span>'+ket+'</span><div class="no">'+r.pos+' <small>dari '+r.dari+'</small></div></div>'; }
  html += '<section class="rank"><h3>Peringkatmu</h3>' +
    baris("Se-kelas", esc(row.sekolah)+', kelas '+esc(row.kelas), rKelas) +
    baris("Se-sekolah", 'Semua peserta '+esc(row.jenjang)+' di '+esc(row.sekolah), rSekolah) +
    baris("Se-Purworejo", 'Semua peserta '+esc(row.jenjang)+' di Purworejo', rKota) + '</section>';

  var sapa = persen <= 0.1 ? "Kamu sudah di jajaran atas Purworejo. Jaga ritmenya dengan try out berikutnya."
    : persen <= 0.5 ? "Posisimu sudah di paruh atas. Beberapa poin lagi, peringkatmu bisa naik."
    : "Masih banyak ruang untuk naik, dan itu bisa dikejar. Mulai dari mapel yang paling butuh perhatian.";
  if(lemah && m.length > 1) sapa += " Mapel yang paling perlu diperkuat: " + lemah.nama + " (" + lemah.skor + ").";
  var idn = "Halo Kak, aku " + row.nama + " dari " + row.sekolah + " (" + row.jenjang + " kelas " + row.kelas + ").";
  var pesanTO = idn + " Aku sudah lihat hasil try out-ku dan mau ikut Try Out lagi. Boleh info jadwal dan cara daftarnya?";
  var pesanPB = idn + " Aku mau ikut sesi pembahasan try out" + (lemah && m.length > 1 ? ", terutama " + lemah.nama : "") + ". Boleh info jadwal dan caranya?";

  html += '<div class="ajak"><p>'+esc(sapa)+'</p><div class="aksi">' +
    '<a class="btn" href="'+linkWA(pesanTO)+'" target="_blank" rel="noopener">Ingin Try Out lagi</a>' +
    '<a class="btn alt" href="'+linkWA(pesanPB)+'" target="_blank" rel="noopener">Ingin pembahasan Try Out</a></div></div></article>';
  $("status").innerHTML = html;
  if(bs.length){
    $("lihatGrafik").onclick = function(){ bukaGrafik(row, bs); };
    bukaGrafik(row, bs);
  }
}

function simulasi(){
  var row = {nama:$("nama").value.trim(), jenjang:$("jenjang").value, kelas:$("kelas").value, sekolah:$("sekolah").value.trim()};
  var bs = Object.keys(SIMULASI_NILAI).map(function(m){
    var b = Math.round(SIMULASI_NILAI[m] / 100 * SIMULASI_SOAL);
    return {nama:m, benar:b, salah:SIMULASI_SOAL - b, kosong:0};
  });
  $("status").innerHTML = '<p class="demo">Ini simulasi tampilan. Nilai pada grafik adalah contoh, sedangkan nama, jenjang, kelas, dan sekolah diambil dari isianmu.</p>' +
    '<button type="button" class="btn lihat" id="lihatGrafik">Lihat grafik benar-salah</button>';
  $("lihatGrafik").onclick = function(){ bukaGrafik(row, bs); };
  bukaGrafik(row, bs);
}

$("form").addEventListener("submit", function(e){
  e.preventDefault();
  if(SIMULASI) return simulasi();
  var n = norm($("nama").value), j = $("jenjang").value, k = $("kelas").value, s = norm($("sekolah").value);
  if(!ALL.length) return pesan("Data belum termuat. Muat ulang halaman lalu coba lagi.", true);
  var cocok = ALL.filter(function(r){ return r.jenjang === j && r.kelas === k && norm(r.sekolah) === s && norm(r.nama).indexOf(n) >= 0; }).slice(0, 8);
  if(!cocok.length) return pesan("Hasil belum ditemukan. Pastikan nama sesuai saat mendaftar, jenjang dan kelas benar, dan sekolah dipilih dari daftar.", true);
  if(cocok.length === 1) return tampilkan(cocok[0]);
  var h = '<p>Ada '+cocok.length+' peserta yang cocok. Pilih namamu:</p>';
  cocok.forEach(function(r,i){ h += '<button type="button" class="pilih" data-i="'+i+'">'+esc(r.nama)+'<small>'+esc(r.sekolah)+' &middot; kelas '+esc(r.kelas)+'</small></button>'; });
  $("status").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll(".pilih"), function(b){ b.onclick = function(){ tampilkan(cocok[+b.getAttribute("data-i")]); }; });
});

function isiDependen(){
  var j = $("jenjang").value, kl = {}, sk = {};
  (KELAS_BAWAAN[j] || []).forEach(function(k){ kl[k] = 1; });
  ALL.forEach(function(r){ if(r.jenjang === j){ if(r.kelas) kl[r.kelas] = 1; if(r.sekolah) sk[r.sekolah] = 1; } });
  $("kelas").innerHTML = j ? '<option value="">Pilih kelas</option>' + Object.keys(kl).sort(function(a,b){ return a - b; })
    .map(function(k){ return '<option value="'+esc(k)+'">Kelas '+esc(k)+'</option>'; }).join("") : '<option value="">Pilih jenjang dulu</option>';
  $("daftarSekolah").innerHTML = Object.keys(sk).sort().map(function(s){ return '<option value="'+esc(s)+'">'; }).join("");
}
$("jenjang").addEventListener("change", function(){ $("sekolah").value = ""; isiDependen(); });

if(pakaiContoh){
  $("contohWrap").hidden = false;
  $("isiContoh").onclick = function(){
    $("nama").value = "Rudi Saputra"; $("jenjang").value = "SMA"; isiDependen();
    $("kelas").value = "12"; $("sekolah").value = "SMAN 1 Purworejo";
    $("form").requestSubmit();
  };
}

muatData();
</script>
